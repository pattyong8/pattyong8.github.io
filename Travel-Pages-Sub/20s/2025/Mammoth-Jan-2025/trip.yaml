          - p032
          - p033
        prose: >-
          Shivam took the next day off, so Noah, Stephanie, and I went to a resort a little farther
          away called June. It reminded me a lot of Deer Valley. Smaller, with wide open groomed
          runs. Not as many tree runs, though there were some, and practically no lines. The snow
          still was not fantastic, but the vibes were unreal. We took a long lunch break, hung
          around, and got photos on the deck.
      - photoIds:
          - p034
          - p035
          - p036
          - p037
          - p038
          - p039
          - p040
          - p041
          - p042
        prose: >-
          As the day wrapped up we went to one of Noah's favorite restaurants in Mammoth, Dos Alas.
          It is a Puerto Rican restaurant, and the meal was incredible. Every dish came with meat
          and rice, and the meats were cooked perfectly.
  - id: day-four
    title: 'Day Four: Back on Mammoth'
    photoIds:
      - p043
      - p044
      - p045
      - p046
      - p047
      - p048
      - p049
      - p050
      - p051
    prose: ''
    blocks:
      - photoIds:
          - p043
          - p044
          - p045
          - p046
          - p047
          - p048
          - p049
          - p050
          - p051
        prose: >-
          Shivam was back the next day, and we hit Mammoth Mountain again. It was beautiful and
          sunny, and we spent the day on the back and the front of the mountain. The snow was pretty
          hard packed. I am not as good as Shivam and Noah, so I was not quite staying with them,
          but we still got some good skiing in.


          After that we drove to a nearby bar Noah was very excited about. I had a Bee's Knees with
          a yellow flower, made with one of the best gins I have had. It was infused with lemon. It
          was fantastic, and the place was extremely cozy.
