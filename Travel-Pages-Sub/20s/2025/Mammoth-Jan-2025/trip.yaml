    prose: ''
    blocks:
      - photoIds:
          - p004
          - p005
          - p006
          - p007
          - p008
          - p009
        prose: >-
          Shivam and I got out to the mountain first. Noah and Stephanie were arriving later that
          day, so we got up, hit the slopes, and got a few runs in, all the way to the backside.
          Then I had to make my way to the front side on my own so I could go pick them up.
      - photoIds:
          - p010
          - p011
          - p012
          - p013
          - p014
          - p015
        prose: >-
          They landed at Bishop Airport. It was only about an hour drive, and I needed something to
          do on the way, so I started listening to crime podcasts, which I had never really done
          before. They were pretty interesting in the moment. I never picked it up as a permanent
          thing, but it was a great way to pass the time.


          Once I got to the airport, Noah and Stephanie were already waiting. I was probably 20
          minutes after they had landed. We made our way back to Mammoth, grabbed a quick lunch and
          a beer, and got a few more runs in before the day ended.
      - photoIds:
          - p016
          - p017
          - p018
          - p019
          - p020
          - p021
        prose: >-
          For dinner we headed to a nearby brewery and split a salad and a burger. It was a hearty
          meal. Later that night we went out to a DJ event that Shivam and Noah were really excited
          about. This was the first time I had really gone out in Mammoth outside of the après area,
          and it was really nice.
