sections:
  - id: day-one
    title: 'Day One: Getting to Mammoth'
    photoIds:
      - p001
      - p002
      - p003
    prose: ''
    blocks:
      - photoIds:
          - p001
          - p002
          - p003
        prose: >-
          I got in and drove up to Mammoth right after the new year. The forecast had said it was
          going to start snowing. I had brought chains just in case, but I had not really thought
          about the possibility of it actually snowing.


          As I got to town it started snowing a little. I decided I needed to get my skis done, so I
          dropped them off at a nearby ski shop. By the time I got out, the snowfall had picked up a
          lot. Driving the Honda CRV without snow tires was becoming precarious. The car was
          sliding, and the wheels were not gaining traction.


          I started driving toward Noah's place, which was up on a hill. Thankfully I pulled over
          right before a one lane highway, because the car was not doing a good job of getting
          traction, and put the chains on. I am so thankful I did. It was so slick. The car would
          not have made it up that hill, and I would have been stuck on a one way highway trying to
          put on chains I had never used before, with nobody able to get around me.


          I spent about 30 minutes figuring the chains out and watched a YouTube video on low
          service. Eventually I found my way to Noah's place, where Shivam was already there. I had
          not seen Shivam in a very long time. We always seem to catch each other on Noah's ski
          trips, and this was no exception.


          We ate sushi that first night, and some ramen. Then I took a nice hot bath in one of the
          bathtubs at Noah's place. What a great way to relax after a good meal.
  - id: day-two
    title: 'Day Two: Noah and Stephanie Land'
    photoIds:
      - p004
      - p005
      - p006
      - p007
      - p008
      - p009
      - p010
      - p011
