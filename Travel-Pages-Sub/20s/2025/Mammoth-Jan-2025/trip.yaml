introParagraph: >-
  Noah's annual birthday trip in 2025 was in Mammoth, at his parents' place. It had insane proximity
  to one of the main lifts. You could literally walk there within five minutes. There was no fresh
  snow, but the vibes were A+. We got to check out a few different resorts, a few different
  restaurants, and a lot of après.
