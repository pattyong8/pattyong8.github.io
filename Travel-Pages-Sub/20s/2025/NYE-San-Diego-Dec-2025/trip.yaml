introParagraph: >-
  For the past couple of years, we had a tradition of renting an Airbnb in San Diego with the New
  York crew for New Year's Eve. That did not happen this year, but instead, I got to celebrate with
  some of my Cal friends from college. Jack could not make it, but we got to catch up with Rishi,
  who had recently moved to San Diego, and spend New Year's Eve with the rest of the fellas. A great
  way to ring in the new year!
