        prose: >-
          Matt and I had gone back and forth on whether to stay in Southern California for New
          Year's Eve or head back to our respective cities. In the end, we decided to stick around
          and carpooled down to San Diego together. We kicked off the trip at a brewery, enjoyed a
          few beers, and then met up with Rishi for dinner.


          Rishi had recently moved down from San Francisco, and he took us to a restaurant he had
          been wanting to bring his family to. It was great to catch up over some good food.
      - photoIds:
          - p004
          - p005
          - p006
        prose: >-
          After dinner, we stopped by Rishi's place for another drink before heading to Connor's.
          Funny enough, Connor was not even there when we arrived. Instead, we were greeted by Ryan,
          Quinn, Jared, Harry, Sam, Emily, and a few other friends. We spent the night playing
          drinking games, catching up, and having a great time ringing in the new year.


          The next morning, Matt, Connor, Rishi, and I decided to hit the gym for a little recovery
          session. Rishi was hilarious, jumping around like nothing had happened the night before
          and doing some of the highest box jumps I had ever seen. A fun way to recover after a long
          night and wrap up another great New Year's trip.
