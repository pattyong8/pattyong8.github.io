introParagraph: >-
  This was a wonderful summer trip with my ES besties and some of our other San Francisco friends.
  We hiked, we drank, we ate, and we laughed. It was a wonderful way to get outdoors and spend some
  time with the people I care about. This was also my first really memorable summer trip to Lake
  Tahoe, and it definitely set the bar high.
