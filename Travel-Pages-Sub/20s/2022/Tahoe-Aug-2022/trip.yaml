      - p057
      - p058
    prose: >-
      The next day was all about taking it easy and enjoying Tahoe. We spent the day on the sandy
      shore, soaking up the sun and taking in how beautiful it was outside.


      At one point, we turned jumping off the dock into another full photo shoot. It wasn't high or
      remotely scary, but we had way too much fun trying to coordinate jumps, spell things out in
      the air, and make increasingly ridiculous poses together.


      We also took a bunch of film photos throughout the day, which captured some of my favorite
      little moments from the trip. This was one of my first times really spending a lot of time
      with Artem and Olivia, which made the weekend even more memorable.


      We played games, ate really good food, spent plenty of time by the water, and just enjoyed
      being together. Nothing overly complicated. Just a good old-fashioned Tahoe summer trip with a
      really great group of people.
