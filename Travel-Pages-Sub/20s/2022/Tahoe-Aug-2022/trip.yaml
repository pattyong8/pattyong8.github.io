      - p014
      - p015
      - p016
      - p017
      - p018
      - p019
      - p020
      - p021
    prose: >-
      We started the trip appropriately prepared with a pretty ridiculous amount of wine, our way of
      making sure we were ready to have a good time.


      One of the highlights of the trip was a pretty steep hike up one of the nearby mountains. As
      we got closer to the top, we came across some rocks that absolutely did not require any
      scrambling. But, being a rock climber, I obviously wanted to climb them anyway. I somehow
      convinced the entire group to come along with me, which turned into a really fun little detour
      and gave me an excuse to embrace my climbing side.


      Eventually, we made it to the viewpoint overlooking Lake Tahoe, and it was absolutely
      beautiful. I had never seen Tahoe from that vantage point before, and it made the climb
      completely worth it. Naturally, we turned the top into a full photo shoot before eventually
      making our way back down.
  - id: lake-cliff
    title: Lake Tahoe & Cliff Jumping
    photoIds:
      - p022
      - p023
      - p024
      - p025
      - p026
    prose: >-
      Later that day, we headed to the lake to cool off after the hike. Joan had told us about a
      cliff-jumping spot nearby, so we swam over to check it out. We didn't bring our phones with
      us, so unfortunately there aren't any photos of the actual jumps, but I decided to jump from
      the very, very top.


      Turns out water gets pretty hard when you hit it from high enough. I landed with my hand
      completely outstretched and came away with a gnarly red mark and bruise from smacking the
      water. It eventually disappeared, and thankfully that was the extent of the damage, but it was
      a pretty good reminder that there is, in fact, a wrong way to land in water.
  - id: korean-bbq
    title: Korean BBQ Night
    photoIds:
      - p027
      - p028
      - p029
      - p030
    prose: >-
      Back at the house, we cooked up an absolute storm. Esther made amazing Korean galbi, and we
      had kimchi and all the fixings, including scallions, lettuce, cucumber salad, and plenty of
      other food. After a full day of hiking, climbing, swimming, and cliff jumping, it was exactly
      the meal we needed.


      One of my favorite random photos from the trip is just the ES besties standing around flossing
      our teeth together afterward. Nothing particularly exciting, but somehow a perfect little
      snapshot of the trip.
  - id: day-at-lake
    title: A Day at the Lake
    photoIds:
      - p032
      - p033
      - p034
      - p035
      - p036
