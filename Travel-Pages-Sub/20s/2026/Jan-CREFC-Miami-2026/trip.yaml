introParagraph: >-
  This was my first CREFC in Miami, and it was a jam packed few days of back to back meetings,
  networking, and events. We got to go to the infamous Joe's Stone Crab with the team, where I also
  met Evan's girlfriend at the time, Rachel. Between all the meetings, we made it out to a few fun
  parties and met some great new people in the real estate industry. A busy trip, but very worth it.
