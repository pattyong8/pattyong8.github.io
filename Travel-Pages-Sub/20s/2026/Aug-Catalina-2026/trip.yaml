introParagraph: >-
  Catalina has officially become one of our traditions. This was our third year doing the trip, and
  Matt and his family were once again so kind to host us. Rishi joined us this year, bringing the
  group to five, and the vibes, as always, were immaculate. There was lots of mini golf, plenty of
  drinking, some new activities, and most importantly, a really good opportunity to catch up and
  spend quality time together.
