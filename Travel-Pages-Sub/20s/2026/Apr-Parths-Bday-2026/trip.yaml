    prose: >-
      It was actually Parth's first time at Dave & Buster's. He had always talked about how much he
      liked arcades, so it felt like the perfect place to take him for his birthday.


      We played basketball, Hungry Hungry Hippos, racing games, and pretty much anything else that
      caught our attention. I somehow kept winning the Hot Wheels game, which became increasingly
      funny as the night went on. Mostly, though, we just bounced between games, competed against
      each other, and had a really good time hanging out.


      After Dave & Buster's, a smaller group of us headed home to keep celebrating. Emily had made
      Parth a really nice strawberry birthday cake, so Parth, Emily, Quinn, Gabby, and I finished
      the night together with cake at home.


      What a great way to bring everyone together and celebrate one of our favorite people. Happy
      birthday, Parth!
