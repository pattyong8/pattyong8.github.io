sections:
  - id: the-pizza-crawl
    title: The Pizza Crawl
    photoIds:
      - p001
      - p002
      - p003
    prose: >-
      We unfortunately don't have many pictures from the pizza crawl, although calling it a crawl
      might be generous. We started the night at a bar where everyone gathered and waited for Parth
      to arrive. In classic Parth fashion, he was late, so basically everyone was already there by
      the time he showed up. John did a great job of eventually getting the birthday boy there.


      After a few drinks, we started the pizza crawl at Artichoke Pizza. Turns out Artichoke may
      have been the worst possible place to start a pizza crawl because the slices were so heavy and
      rich that everyone was basically done eating after our first stop. So instead of forcing
      ourselves through more pizza, we abandoned the crawl and headed straight to Dave & Buster's.


      I also got Parth a birthday sash to wear throughout the night, which he sported through both
      pizza and the arcade. Before heading inside Dave & Buster's, we stopped for another round of
      drinks, where the bartender made Parth a ridiculous birthday shot. He clearly did not enjoy it
      at all, which made it even funnier, but he powered through and drank it anyway. We also
      managed to get a great group photo before heading inside.
  - id: dave-and-busters
    title: Dave & Buster's
    photoIds:
      - p004
      - p005
      - p006
      - p007
      - p008
      - p009
      - p010
      - p011
