introParagraph: >-
  I am definitely not the biggest sports fan, but when your local team makes a deep run in the
  playoffs, it is hard not to get caught up in the excitement. Coincidentally, I had actually gone
  to three Knicks games that season and had the chance to see them play against some of the best
  teams in the league, including OKC. So this ended up being a particularly fun year to follow the
  Knicks, and I was glad I got to be a part of the excitement in New York.
