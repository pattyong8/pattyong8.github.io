introParagraph: >-
  As I usually do, I came home for the summer to enjoy some time with family and friends. This
  summer was particularly significant because there was a new member of the family. Annabelle was
  born in the summer of 2026, and I came back a few times to see her, spend time with her, and enjoy
  my new role as the funcle. What a wonderful milestone for Vinny and Erin and for our entire
  family.
