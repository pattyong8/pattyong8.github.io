sections:
  - id: annabelle
    title: Annabelle
    photoIds:
      - p001
      - p002
      - p003
    prose: >-
      The summer of 2026 was really defined by getting to spend time with Annabelle, my new niece.
      She was the cutest, most precious baby I had ever met. I went over to Vinny and Erin's many
      times just to see her, hold her, and spend time with the newest member of our family.


      I really had not spent much time around babies before, so I learned a lot during these visits.
      Even something as simple as learning how to comfortably hold and take care of a baby was new
      to me. It was really special getting to know Annabelle during the first few months of her life
      and watching Vinny and Erin settle into being parents.
  - id: family-dinner
    title: Family Dinner
    photoIds:
      - p004
      - p005
      - p006
      - p007
      - p008
      - p009
    prose: >-
      Of course, being home also meant eating incredibly well. While I was visiting and meeting
      Annabelle, Vinny decided to cook up a storm. He had bought a bunch of steaks from Costco a few
      weeks earlier and saved the rib caps that he had butchered himself. They were incredible.


      Mom and Doug also made fresh pesto pasta, and Doug brought some of his signature homemade
      bread. We even finished everything off with snickerdoodles. A pretty classic family meal where
      there was absolutely no shortage of food.
  - id: meals-out
    title: Meals Out
    photoIds:
      - p010
      - p011
      - p012
      - p013
      - p020
      - p021
      - p022
      - p023
      - p024
    prose: >-
      Vinny, Mom, and I also went to Chubby Cattle, an all you can eat Japanese barbecue spot that
      Vinny was really excited to try. They had an amazing selection of meats and other dishes. It
      was definitely expensive, but everything was very tasty.


      I also tried uni mentaiko for the first time. It was good, although I think I still prefer
      having uni fresh rather than in mentaiko form.


      Mom and I went to try Tim Ho Wan together. The dim sum was good, and I was particularly
      impressed by the har gow. They were really tightly put together and well made.
  - id: home-cooked-meals
    title: Home Cooked Meals
    photoIds:
      - p014
      - p015
      - p016
      - p017
      - p018
      - p019
      - p025
      - p026
      - p029
    prose: >-
      A lot of the summer was simply home cooked meals with the family. Mom made jambalaya during
      another visit to Vinny and Erin's, and Doug made fresh homemade pizzas.


      Picture 18 was easily my favorite: sausage, mushrooms, and cheese. Just can't get enough of
      that combination.


      As you can probably tell from the photos, there was a lot of food this summer. Mom is always
      cooking something wonderful whenever I'm home.


      It was also incredibly hot, so Mom made some aiyu, which was the perfect refreshing drink for
      the weather.
  - id: other-activities
    title: Other activities
    photoIds:
      - p027
      - p028
      - p030
      - p031
    prose: >-
      But there was also plenty of time with family in between all the meals. I got to spend more
      time with Annabelle, Davis and I hung out by the pool, and we went to visit Mom while she was
      pet sitting at a house.


      We also went to Diamond Jamboree for bingsu, which is always a good summer dessert.


      Vinny and I went out to play nine holes at the par three course near John Wayne Airport. We
      ended up finishing within one stroke of each other. I lost it a little toward the end, but
      overall I was playing and hitting the ball pretty well, which was exciting.


      Before I left, we went to see The Odyssey together in 70mm IMAX. It was one of the best
      moviegoing experiences I'd had in a while. Christopher Nolan shot the movie in IMAX, and you
      could really feel the scale of it on that screen.


      Our seats on the left side of the theater were definitely not ideal, but it almost didn't
      matter. Some of the images were so immersive that it felt like you were actually inside the
      scene. It had been a long time since I'd had an IMAX experience that felt like that.


      Between welcoming Annabelle into the family, spending time with everyone, eating way too much
      good food, golfing with Vinny, and simply being back home, this was a particularly special
      Irvine summer.
