introParagraph: >-
  Danny and Sabrina's wedding was one of the highlights of 2026. I've known Danny since college, and
  I've known many of the people at the wedding since we all started interning at Amazon in the
  summer of 2018. Along the way, that group has only grown as we've met more friends and brought
  more people into the crew. What a great way to bring everyone back together and celebrate the
  marriage of two lovely people.
