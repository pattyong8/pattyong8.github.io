introParagraph: >-
  Noah does a birthday ski trip every year, and this year was no different. It was full of friends,
  food, drinks, and enjoying one of Noah's favorite sports. This was the first time we had gone to
  Whistler for his birthday, and boy was it a lavish and luxurious time. Good vibes all around.
