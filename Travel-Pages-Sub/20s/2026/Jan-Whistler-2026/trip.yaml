sections:
  - id: day-one
    title: Day One
    photoIds:
      - p001
      - p002
      - p003
      - p004
      - p005
      - p006
      - p007
      - p008
      - p009
    prose: >-
      I flew into Vancouver and had not been through the airport in a while. I had completely
      forgotten how cool it was inside, with the huge indoor water feature and all of the native
      architecture, boats, and artwork throughout the airport.


      After making it through customs, I hopped on a bus for the roughly two and a half to three
      hour ride from Vancouver to Whistler. The bus was actually really comfortable, and eventually
      I made it to Whistler and checked into the hotel room I was sharing with Noah and Stephanie.


      That night, Noah and I went to dinner with Logan at Bearfoot Bistro. This was actually the
      first time I ever met Logan, which is funny looking back on it now. Bearfoot Bistro is one of
      the nicer restaurants in Whistler, so we went all out with a bunch of different dishes to
      share and some really nice wine. It was definitely an expensive meal, but the food was great
      and felt like an appropriate way to kick off Noah's birthday weekend.


      We also got to go down into the wine cellar and see their massive wine collection. Someone
      showed us around and explained that they even had an option where you could saber a bottle of
      champagne. Definitely one of the more extravagant ways to start a ski trip.
  - id: day-two
    title: Day Two
    photoIds:
      - p010
      - p011
      - p012
      - p013
      - p014
      - p015
      - p016
      - p017
      - p018
      - p019
      - p020
    prose: >-
      Our first real ski day started with Sebastian, Donnie, Noah, and me heading up the mountain. I
      had bought a two day pass and was expecting to get a ton of skiing in over the weekend. Turns
      out I bit off a little more than I could chew almost immediately.


      For basically my first real run of the season, I decided to follow the guys down one of the
      steepest runs I had ever seen. I remember standing at the top, peering over the edge and
      thinking that this looked less like a ski run and more like a cliff. Noah went first, made a
      few turns, and successfully got himself down. Naturally, I decided I could do the same.


      My first turn went well. I slid down quite a bit, made a second turn, and successfully got
      myself past a grouping of rocks. Then I went for my third turn, turned way too hard, and my
      skis went out from underneath me.


      I started falling backwards down the mountain at an insane speed. I probably slid a couple
      hundred feet in a giant plume of snow and genuinely had no idea where I was, how fast I was
      going, or what was around me. I was doing everything I could to slow myself down until I
      eventually came to a stop. Noah and Donnie thought I might have died.


      It was probably one of the scariest moments I have ever had skiing and a very good reminder
      that skiing is dangerous and you have to know your limits.


      Once I collected myself, I realized I thankfully was not seriously injured. My left ankle was
      throbbing, though, and skiing on it was noticeably harder. I carefully made my way down the
      rest of the mountain, and we did a little more skiing before deciding it was probably time for
      a break.


      We met up with the rest of the crew for lunch at the Four Seasons. Apparently, lunch here has
      become something of a tradition for this group. The restaurant is tucked inside the resort,
      and everyone seems to love stopping here in the middle of a ski day. The food was good,
      although nothing incredible, but it was nice to get the whole group together.


      I kept telling Noah that I had paid for a ski pass and wanted to get my money's worth. My
      ankle also was not feeling too terrible at that point, so I decided to head back out with the
      guys.


      We took the gondola all the way back up and ultimately only got one more run in. Given what
      had happened earlier, I was not taking any chances. I stuck almost entirely to groomers and
      carefully skied all the way back down to the bottom.
  - id: day-two-evening
    title: ''
    photoIds:
      - p021
      - p022
      - p023
      - p024
      - p025
      - p026
      - p027
    prose: >-
      After skiing, we went to Scandinave, and initially my ankle actually felt okay.


      I think this is where I really messed up.


      At Scandinave, I kept going from extreme heat to extreme cold, jumping from the sauna into the
      ice bath and then doing it all over again. Whatever I had pulled or injured earlier clearly
      did not appreciate that decision. Suddenly, I was in some of the worst pain I had felt in a
      long time. I could barely put any weight on my foot, and even sitting still hurt.


      I eventually took some painkillers, and the hotel was nice enough to give me crutches. Once
      the painkillers kicked in, I was at least able to survive the rest of the night.


      Thankfully, we had a pretty great dinner waiting for us.


      That evening, Noah had signed us up for dinner at Wild Blue. It was more of a prix fixe
      tasting experience, with shared appetizers, individual dishes, and plenty of wine. Even while
      hobbling around on crutches, I thought it was fantastic.


      As good as Bearfoot Bistro had been the night before, I actually liked Wild Blue even more.
      The seafood, bread, wine, and dishes all felt a little more elegant and were incredibly tasty.
      Both restaurants were excellent, but Wild Blue was probably my favorite meal of the two.


      Not exactly how I expected my first full ski day in Whistler to end, but at least I injured
      myself somewhere with very good food.
  - id: more-photos
    title: Day Three
    photoIds:
      - p028
      - p029
      - p030
      - p031
      - p032
      - p033
      - p034
      - p035
      - p036
    prose: >-
      Because of my ankle, I decided not to ski on our last full day. It was definitely a bummer
      considering I had bought a two day pass, but that is what happens when you injure yourself on
      basically your first run of the trip.


      It actually ended up being a pretty good day to sit out. It was snowing lightly throughout
      Whistler, which was beautiful from the perspective of hanging out and watching from the
      village. Apparently, visibility up on the mountain was terrible, though, so I was secretly
      pretty happy not to be skiing. Those are definitely not my favorite conditions.


      My ankle was feeling better, although still nowhere near 100 percent, so I took it easy at the
      hotel and got ready for the main event of the day: Longhorns.


      I headed over around 2 or 3 p.m., and we had such a good time. In classic Noah fashion, he had
      reserved a huge table right in front of the DJ booth. There was a pretty hefty minimum spend,
      but boy was it worth it. Our table even had a little fireplace in the middle, which made the
      whole setup even more vibey.
  - id: day-three-longhorns
    title: ''
    photoIds:
      - p037
      - p038
      - p039
      - p040
      - p041
      - p042
    prose: >-
      Ty, Kells, and I were some of the first people there, so I got to spend some quality time with
      them before everyone else finished skiing. We immediately got started on the food and drinks.
      Wings, nachos, oysters, pitchers of beer, and pretty much anything else we could order.
      Eventually, the rest of the group came down from the mountain and joined us, and that was when
      the real partying started.


      Before everyone drank a little too much, I decided we needed to order at least one bottle
      service type item for Noah's birthday. We went with the cheapest bottle they had, which was a
      bottle of Veuve champagne, mostly because I wanted Noah to get the full birthday treatment.
      They came over with sparklers and a sign, and we took a ton of photos and videos celebrating
      Noah in very Noah fashion.


      As the sun started going down, Longhorns became more and more of a party. The umbrellas came
      down, everyone started standing on chairs, the music got louder, and the entire place was going
      off. People around us kept ordering champagne showers, which were hilarious to watch, and the
      energy just kept building throughout the night.
  - id: day-three-morning
    title: ''
    photoIds:
      - p043
      - p044
      - p045
      - p046
      - p047
      - p048
      - p049
      - p050
      - p051
      - p052
      - p053
      - p054
      - p055
      - p056
      - p057
      - p058
    prose: >-
      Longhorns definitely has a reputation, and it completely lived up to it. More importantly, I
      got to spend some really good quality time with a lot of the people who had come out to
      celebrate Noah.


      The next morning was significantly less glamorous.


      I somehow woke up at 4 a.m., completely delirious and more than a little hungover, and realized
      I had no idea where my phone or wallet were. I also had not packed anything, my skis were still
      downstairs, and I had a bus leaving for Vancouver at 7 a.m.


      Thank goodness I randomly woke up when I did because, without my phone, I did not even have an
      alarm to wake me up. Somehow, within about an hour, I packed all of my stuff, retrieved my
      skis, found both my phone and wallet, gathered everything I needed, and got myself ready to
      leave. I even managed to get another hour of sleep before heading out at 7 a.m.


      If I had not randomly woken up at 4, I almost certainly would have missed the bus and probably
      my flight home too. Boy was that a tough travel day, but completely worth it for such a fun
      birthday trip with Noah and the gang.
