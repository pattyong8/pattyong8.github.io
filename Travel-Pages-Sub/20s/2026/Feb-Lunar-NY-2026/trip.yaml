    prose: >-
      We went to Chinatown pretty early, and the streets were already a mess. Manhattan Chinatown
      does not mess around for Lunar New Year. There were fireworks, confetti, and people
      everywhere. It was chaotic and messy, but all part of the festive spirit.


      I went over early to put our name down at Uncle Lou because I really wanted to make sure we
      got in, and it did not disappoint. The braised pork belly was incredible and definitely the
      highlight of the meal. The rest of the dishes were pretty good, although nothing quite
      compared to the pork belly.


      Before everyone showed up, I decided to commit to a little bit. I bought red envelopes and
      some fake cash and put the fake money inside to hand out to my friends. I later learned that
      apparently putting fake money in red envelopes is bad luck, so maybe not my most culturally
      accurate Lunar New Year contribution. Still, it made for a very funny moment with everyone.


      Always nice to find another reason to get the group together, eat some good food, and
      celebrate. Until next year!
