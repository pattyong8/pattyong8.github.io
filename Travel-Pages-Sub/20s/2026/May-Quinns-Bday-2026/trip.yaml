    prose: >-
      We had people from all different parts of Quinn's life come out for tennis. Gabby and her
      friends joined, along with some of Quinn and Parth's tennis friends from college, Quinn's
      sister, our other New York friends, and even Rishi's sister. We had five really good tennis
      players and plenty of intermediate players and beginners, so it was really just about getting
      everyone on the courts and having a good time.


      I also came prepared in my full tracksuit. Parth had given me a Pomona Pitzer Nike top, and it
      turned out I had matching bottoms from City on water polo, so naturally I had to wear the full
      set.


      We spent a lot of the day playing Around the World, while some of the better players got
      together for Dingles. Mostly, though, everyone just hit around, rotated between the three
      courts, and enjoyed getting to play tennis at the US Open with such a big group of friends.
      Despite the wind, it ended up being a great way to celebrate Quinn.
  - id: chinatown
    title: Chinatown
    photoIds:
      - p013
      - p014
      - p015
      - p016
      - p017
      - p018
    prose: >-
      After tennis, we headed to Chinatown and basically turned the rest of the afternoon into a
      food tour. We bounced around trying duck buns, spicy dumplings, sheng jian bao, steamed rice
      rolls, and a ton of other great food.


      It was a pretty perfect way to end the day. Lots of tennis, way too much food, and a big group
      of people we care about all getting together to celebrate Quinn's birthday.
