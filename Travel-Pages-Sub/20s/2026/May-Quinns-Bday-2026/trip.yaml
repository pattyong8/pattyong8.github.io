introParagraph: >-
  Quinn's birthday present may have been half a year late, but it was one of the coolest yet. We
  rented three tennis courts at the US Open and brought together a ton of friends to celebrate
  Quinn's birthday during some hopefully better weather. Turns out the day was incredibly windy, but
  we still got everyone together, played a ton of tennis, and finished the day eating our way
  through Chinatown. Happy birthday, Quinn!
