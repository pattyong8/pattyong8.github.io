introParagraph: >-
  Elliot graciously hosted us at his house in Hawley, Pennsylvania, which he had bought about a year
  earlier. It was a wonderful cabin tucked away in the woods deep in the Poconos and the perfect
  place to spend the Fourth of July. We swam, we drank, we ate, and we rode electric rail bikes.
  What a great weekend getaway with the New York crew.
