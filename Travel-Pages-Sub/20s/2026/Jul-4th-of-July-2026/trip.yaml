sections:
  - id: arrival-and-activities
    title: Arrival and Activities
    photoIds:
      - p001
      - p002
      - p003
    prose: >-
      We decided to head up Friday morning rather than Thursday night, which gave us the day to make
      our way to Hawley and start exploring. The train ride up was surprisingly easy and almost
      completely empty, so we basically had entire rows to ourselves. I figured out the perfect way
      to position my phone so I could lean back and watch the My Hero Academia movie without even
      having to hold it, which Parth found funny enough to document. Meanwhile, Parth took the
      window seat facing the direction the train was moving so he could watch the scenery and nature
      go by.


      Once we arrived, we checked out the nearby lake and beach area. We didn't spend much time
      there, but it was nice knowing there was an easy place nearby for a beach day.
  - id: arrival-and-activities-cont
    title: ''
    photoIds:
      - p004
      - p005
      - p006
      - p007
      - p008
      - p009
      - p010
      - p011
      - p012
      - p013
      - p014
      - p015
      - p016
    prose: >-
      Our first real activity of the weekend was one of the more unique things I've ever done:
      electric rail bikes. They were basically little cart like vehicles attached directly to
      railroad tracks, with both electric assistance and manual pedaling. I was paired with Elliot,
      Peter, and Parth, and we made our way along the tracks through Hawley. Parth's sister also
      joined us for the trip, which was fantastic.


      We loaded ourselves up with sunscreen and set off. The whole experience was really fun, but my
      favorite part was riding through this narrow section surrounded by cliffs. It almost looked
      like a Disneyland set because the surroundings felt too perfectly constructed to be real.


      After the rail bikes, we stopped for sandwiches at an old cotton factory. The sandwiches were
      a little small, but really good, and we got to sit outside and enjoy them together before
      heading back.
  - id: fourth-of-july
    title: Fourth of July
    photoIds:
      - p017
      - p018
      - p019
    prose: >-
      The next day was the Fourth of July, and it was time to get out on the water. Leading up to
      the trip, we had talked about renting a boat but realized that most of us didn't have the
      boating license we needed.


      Thankfully, Gaby came in incredibly clutch. She had a boating license and joked that she had
      basically been waiting her entire life for this exact moment to finally be useful to the
      group.


      It made sense once we learned more about her boating background. Gaby grew up boating and had
      even been a wakeboard instructor, so she immediately became the professional of the group. She
      made sure everyone understood what we were doing and how to stay safe before we headed onto
      the water.


      Once we were out there, I became determined to learn how to front flip and backflip into the
      lake. I spent a ridiculous amount of the afternoon repeatedly throwing myself off the boat,
      and by the end I actually felt like I was starting to get both of them down.
  - id: fourth-of-july-cont
    title: ''
    photoIds:
      - p020
      - p021
      - p022
      - p023
      - p024
      - p025
    prose: >-
      At some point, I also heard there was a cliff jumping spot around the corner and decided I
      would just swim over to investigate. It turned out to be much farther away than expected, and
      when I finally got close enough to see it, it didn't even look that cool. So I turned around
      and made the long swim back.


      We had originally rented the boat for three hours, but toward the end the clouds started
      rolling in and it began to rain a little. We decided to cut the boat trip short and head back
      to Elliot's to spend the rest of the Fourth together.


      We weren't able to see any fireworks that night, but it really didn't matter. Elliot and Lucy
      made everyone a wonderful dinner with burgers, pasta, salad, and plenty of food to share. We
      spent the evening eating, drinking, hanging out, and enjoying each other's company at the
      house. It was a pretty perfect way to spend the Fourth.


      Before leaving, I also made a drawing to commemorate the weekend. I drew all of us together on
      the boat, with Gaby navigating and Lucy's dog joining us for the ride. It felt like the
      appropriate way to capture the trip: all of us together on the water, celebrating the Fourth
      of July in Hawley.
