sections:
  - id: drive-up
    title: Drive Up
    photoIds:
      - p001
      - p002
      - p003
      - p004
      - p005
      - p006
    prose: >-
      Noah and I decided to drive up early so we could have some extra time in Whistler, work from
      our Airbnb, and hopefully get a little golf practice in before playing with Danny. The drive
      itself ended up being one of the highlights. I don't think I've ever seen Noah so excited
      about a drive. We passed beautiful water, enormous granite cliffs, and some incredible scenery
      as we made our way farther into British Columbia. Even though we still had to work along the
      way, it was a pretty great way to spend the day.


      The border crossing was also entertaining. We felt like we were getting scrutinized a little
      more than necessary with all the questions, but eventually we made it through and continued
      north.


      Getting there early ended up being a great decision because Noah and I desperately needed some
      practice. We're both still learning and were definitely a little rusty, but we did our best to
      get our swings back into shape. Afterward, we headed into Whistler for some pizza. It was
      certainly nothing like New York pizza, but both of our slices had just come out of the oven,
      and there is something about perfectly hot, fresh pizza that always hits.


      This was originally supposed to be primarily a climbing trip, but it quickly evolved into a
      golfing, climbing, eating, relaxing, and exploring Whistler trip. That ended up being even
      better.


      We also discovered one of our favorite Canadian phrases at the Airbnb: "predatory towing." For
      some reason, the wording on the parking warning absolutely killed us, so naturally it deserved
      a photo.
  - id: exploring-whistler
    title: Exploring Whistler
