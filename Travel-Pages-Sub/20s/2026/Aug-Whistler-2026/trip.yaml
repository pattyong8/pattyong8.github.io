    prose: >-
      The next part of the trip was really just Noah and me exploring Whistler. There was so much to
      see, and we spent a lot of time simply walking around and taking everything in.


      We made our way through the Olympic Village because Noah wanted coffee and started noticing
      the incredible water throughout the area. It had this strange milky, mineral quality that
      looked completely different from the water we were used to seeing. At first we weren't even
      sure if it was natural, but we would eventually see more of it the next day.


      Pictures 15 through 17 were from walking among the trees around the Olympic Village. You could
      actually smell the cedar as you walked through, which was amazing and made the whole place
      feel even more distinctly Pacific Northwest.


      Pictures 20 through 24 were this random chair we found in the middle of the neighborhood
      around our Airbnb. It had signatures and names carved all over it, and naturally we spent way
      more time with this chair than anyone probably needed to.
  - id: cad-is-free
    title: CAD is Free
    photoIds:
      - p025
      - p026
      - p027
      - p028
      - p029
      - p030
      - p031
      - p032
      - p033
      - p034
    prose: >-
      We grabbed lunch at a nearby French crêpe restaurant, which was honestly just all right. But
      this was around the time we established one of the defining jokes of the trip: CAD is free.
      Everything seemed expensive, but because the prices were in Canadian dollars, we simply
      decided they weren't real. It was a convenient philosophy as we proceeded to spend
      considerably more money than we usually did.


      That philosophy continued at Scandinave, a beautiful outdoor spa surrounded by the mountains
      and trees. When we arrived, there was only one massage slot available. I am not as big a fan
      of massages, so Noah decided to get the massage. The woman at the front desk was incredibly
      nice and gave me a discount since there weren't any massages available for me.


      We spent probably three hours there. I went back and forth between the sauna and cold plunge
      over and over again, relaxed in the solarium, did some yoga, and generally did absolutely
      nothing for a few hours. It was fantastic.


      We ended the night at a steakhouse, where we got steak tartare, beef Wellington, and a salad.
      The meal was honestly fantastic and continued our emerging tradition of pretending Canadian
      dollars did not count.
  - id: olympic-village-mcd
    title: Olympic Village + McDonald's
    photoIds:
      - p035
      - p036
      - p037
      - p038
      - p039
    prose: >-
      Pictures 35 through 37 capture me attempting to get onto a rock in the middle of the man made
      lake in Olympic Village while Noah watched, increasingly convinced that I was about to fall
      into the water.


      Later that night, we started making stops at different fast food places because I was dating
      Rivo at the time and Rivo loved fast food. At McDonald's, we got one of their little apple
      pies and soft serve, which was somehow so good and so bad at exactly the same time.
  - id: lake-hike-four-seasons
    title: Lake Hike + Four Seasons
    photoIds:
      - p040
      - p041
      - p042
      - p043
      - p044
      - p045
      - p046
    prose: >-
      The next morning, Noah and I decided to start the day with an easy two or three mile hike
      around a nearby lake. The weather was beautiful, so it was impossible to say no. We grabbed
      coffees and started walking.


      One of the coolest parts was seeing the milky, mineral looking water we had noticed the day
      before meet completely clear water coming from another part of the river system. You could
      literally see the two different colors of water coming together. Pictures 43 through 45 were
      from the lake itself, which was another reminder of just how beautiful this part of British
      Columbia is.


      Of course, Noah also somehow steered us onto the black diamond equivalent route to the lake
      instead of the green run. The trails were really marked for mountain bikers, so the steepness
      was very much a factor. Yes, it was quicker, but we were completely out of breath by the time
      we got to the top. Classic Noah, always taking the most extreme path.


      After the hike, we headed back and finally met up with Danny and Sabs for lunch at the Four
      Seasons. Sabs and I were joking that trips with both Danny and Noah were becoming increasingly
      more and more lux. We were developing a taste for the finer things in life.


      More importantly, it was really nice to actually spend quality time with Danny and Sabs. Their
      wedding had been so busy that I didn't get much time to really catch up with either of them.
      Here, we could just sit around, eat, have some great cocktails, get a little boozy, and hang
      out together without anywhere else we needed to be.
  - id: fairmont-golf
    title: Golf at the Fairmont
    photoIds:
      - p047
      - p048
      - p049
      - p050
      - p051
      - p052
      - p053
    prose: >-
      That afternoon, it was time for golf at the Fairmont. The course was absolutely beautiful and,
      surprisingly, wasn't even that expensive. For a little over $100, we got to play an incredibly
      well maintained course surrounded by the mountains.


      I had to rent clubs and grabbed a few extra sleeves of balls, which turned out to be a very
      good decision. I definitely did not play particularly well, but the vibes were great the
      entire time.


      One funny memory from warming up was challenging Danny to a putting competition and somehow
      draining a 30 foot putt right off the bat. I still can't believe that went in.


      Our fourth was a random Japanese man named Masa, who turned out to be by far the best golfer
      in the group. He was incredibly patient and nice about playing with the rest of us and only
      really blew up on one hole. At some point, he even invited me to play another round with him
      the next day. I eventually declined, but it became a funny running joke between Danny, Noah,
      and me.


      We had a 4:55 tee time and were determined to get every possible dollar of value out of it, so
      we kept playing until it was basically pitch black. We somehow made it through the 17th hole,
      although I lost my ball because I literally couldn't see where it went. At that point, we
      finally accepted defeat.
