introParagraph: >-
  About a month after Danny and Sabrina got married, the two of them, along with Noah and me, headed
  up to Whistler for a wonderful summer weekend in the mountains. We golfed at the Fairmont, relaxed
  at Scandinave, had lunch at the Four Seasons, and even got to rock climb in Squamish. What a great
  way to spend some quality time with people I care about in one of the most beautiful places in the
  Pacific Northwest. The theme of the trip became clear: CAD is free.
