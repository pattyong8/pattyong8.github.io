    prose: >-
      Dinner that night was at Bearfoot Bistro, one of the restaurants all the Seattle people had
      been talking about and one of the nicest restaurants in Whistler. We went all in on the
      experience, including the vodka tasting room and the full coursed out dinner.


      While the boys were having fun doing the ice room vodka tasting, Sabs and I were having the
      real fun taking photos, exploring all the different vodka bottles, and acting like bartenders.


      The food was fantastic, the desserts were great, and the whole meal felt appropriately over
      the top for a trip where we had already decided money wasn't real.


      Then, halfway through dinner, the power went out. Their payment system stopped working, so the
      restaurant took down our credit card information manually. For at least a little while, there
      was a chance that our nearly $200 per person dinner might somehow end up being free. Given the
      theme of the trip, it felt strangely appropriate.
  - id: squamish
    title: Climbing in Squamish
    photoIds:
      - p081
      - p082
      - p083
      - p084
      - p085
    prose: >-
      The next morning, Noah and I got ready to head toward Squamish to climb. We started the day
      with an Australian style meat pie, and I got a mushroom and beef one that was genuinely one of
      the best pot pies I've ever had.


      It had rained that morning, so a lot of the climbing routes were too wet, but thankfully we
      found a few that were climbable. I was able to flash both a 10B and a 10D while leading, which
      I was really proud of. The 10B was pretty airy, while the 10D was shorter and much more
      bouldery. Being able to send both without falling felt really good.


      Noah and I were also reminded that we needed to keep practicing our lead climbing technique.
      We caught ourselves back clipping a few times, which was a good reminder to slow down, pay
      attention, and continue being careful. But overall, we were both sending hard and having a
      great day.


      One of the funniest memories was all the caterpillars and worms in the trees around the
      climbing area. Noah became convinced that they were dangerous and that their webs or droppings
      might be poisonous. We all started freaking ourselves out, only to eventually realize that he
      had confused them with an entirely different species from the UK and that the ones around us
      were harmless. We spent part of the drive back reading descriptions of worms and caterpillars
      and laughing about how worked up we had gotten.


      Driving through Squamish also gave us incredible views of the Chief, the enormous granite wall
      towering over the area. Between the climbing and simply seeing formations like that along the
      highway, Squamish was a pretty spectacular place to spend the day.


      We had originally hoped to see Danny and Sabs again afterward, but between climbing and
      traffic, we weren't able to make it happen.
  - id: vancouver
    title: Dinner and Dessert in Vancouver
    photoIds:
      - p086
      - p087
      - p088
      - p089
      - p090
      - p091
      - p092
    prose: >-
      Before heading all the way back to Seattle, we stopped in Vancouver for dinner, where Noah
      picked Saku, an incredible katsu spot he had been to before.


      Oh my gosh, it was so good. There was unlimited rice, unlimited soup, great sides, and
      perfectly fried, fatty katsu. We even ordered a fried cheese dish that I had never tried
      before. Noah and I were basically losing our minds over the entire meal.


      One of the funniest parts was the cabbage and sauce. They gave us what was essentially a
      ketchup sized bottle of sauce, and Noah absolutely drenched his cabbage in it. By the end of
      dinner, he had somehow gone through what felt like half the bottle, which I could not stop
      laughing about.


      Afterward, we were walking around Vancouver and found a water station attached to a fire
      hydrant. Obviously, we had to drink from it. There was something very funny about having an
      actual picture of us essentially "drinking from a fire hose."


      And because we apparently had not eaten enough already, we ended the night with bingsu. It was
      this banana and whipped cream creation, and it was ridiculously good. We finished the entire
      thing while laughing about how much food we had already eaten and the fact that we were
      somehow continuing to eat.


      What a great trip and so many great memories. These are genuinely some of my favorite people
      in my life. I don't get to spend time with them as often as I would like, but whenever I do,
      it reminds me how much they care about me and how lucky I am to have such good friends.
      Between Whistler, Squamish, Vancouver, golf, climbing, way too much food, and our newfound
      belief that Canadian dollars are free, this was one of those trips I know I'll remember.


      Looking forward to the next Seattle summer trip.
