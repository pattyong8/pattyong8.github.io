introParagraph: >-
  Game three out of three for my 2026 Knicks season. I went with Quinn to Madison Square Garden to
  watch the Knicks take on OKC, one of the best teams in the league. We spotted a ton of
  celebrities, ate some good old Mike's Hot Honey chicken, and got to watch two great teams play at
  the Garden. I am not the biggest basketball fan, but three Knicks games in one season might say
  otherwise. What a great time.
