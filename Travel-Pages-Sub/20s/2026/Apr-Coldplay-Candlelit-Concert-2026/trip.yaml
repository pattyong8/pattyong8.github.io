introParagraph: >-
  For my birthday, Parth planned a surprise candlelit concert in a church in Brooklyn featuring
  mostly Coldplay with some Ed Sheeran mixed in. Coldplay is my favorite artist, so it was such a
  thoughtful surprise and a really nice way to celebrate my birthday with some of my best friends in
  New York. I had always wanted to go to one of these candlelit concerts, and it ended up being a
  really special experience.
