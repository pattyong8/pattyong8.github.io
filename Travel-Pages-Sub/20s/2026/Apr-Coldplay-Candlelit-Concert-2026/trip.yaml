    prose: >-
      I had absolutely no idea what the surprise was beforehand. Quinn and I biked over together,
      and we had an incredibly difficult time finding bikes to get there in the first place. I was
      also very confused about where we were going and what exactly Parth had planned.


      Eventually, we made it to the church and everything started to make sense. The entire space
      was filled with candles, and we got to sit together and listen to musicians play some of my
      favorite Coldplay songs. Sadly, they did not play "Charlie Brown," but I will forgive them.


      One of the funniest moments came toward the end when they asked the audience whether people
      wanted to hear more Coldplay or Ed Sheeran. There was very clearly more cheering for Coldplay,
      which was obviously the correct answer. For some reason, they proceeded to play Ed Sheeran
      anyway, making the entire audience vote seem a little pointless.


      All in all, it was such a good experience. I had never been to a candlelit concert before and
      had always wanted to try one. Getting to experience it for the first time as a birthday
      surprise, surrounded by my New York friends and listening to my favorite artist, made it even
      better.
