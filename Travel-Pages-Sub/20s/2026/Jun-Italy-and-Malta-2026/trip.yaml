    blocks:
      - photoIds:
          - p030
          - p031
          - p032
        prose: >-
          The night before, Parth and I had booked a cruise that would take us out to the Blue
          Lagoon, which was one of Quinn's biggest recommendations for Malta, as well as Gozo. The
          water was absolutely beautiful, and as soon as we set sail you could tell it was going
          to be a great day for photos and swimming in some of the bluest water I had seen in
          years. You could also immediately tell what kind of vibe the boat was going for. They
          offered this pineapple cocktail package that was something like 20 euros for five
          drinks, which was ridiculously cheap, so Parth and I immediately bought one to share.
          Ironically our first drink was just orange juice, but we eventually made our way through
          plenty of Aperol Spritzes.
      - photoIds:
          - p033
          - p034
          - p035
        prose: >-
          By Picture 34 we had made it to the Blue Lagoon. The boat itself was pretty large but
          surprisingly empty, so we had tons of room. It had a slide into the water and a second
          level you could jump from, both of which I obviously took advantage of.
      - photoIds:
          - p036
          - p037
          - p038
        prose: >-
          After swimming around the boat for a while, Parth and I decided to explore the island.
          We had chosen the itinerary that split our time between the Blue Lagoon and Gozo rather
          than spending four hours at the lagoon. Our first idea was to swim all the way across to
          the main area where everyone else was hanging out, but we quickly realized it was much
          farther than it looked. Halfway through our attempt, a boat started trying to dock in
          the little cove we were swimming through, and we suddenly had to sprint out of the way.
          Eventually we got out and tried to walk over barefoot, only to get turned around because
          we needed our island passes and actual shoes. We went all the way back to the boat,
          grabbed everything, checked ourselves in as guests, and finally made it over.
      - photoIds:
          - p039
          - p040
          - p041
        prose: >-
          Once we reached the main Blue Lagoon area, we spent some time floating around in the
          water. I had brought my phone and was reluctant to just leave it sitting on shore, but a
          woman sitting near one of the public tents offered to watch my phone and shoes for us.
          It was incredibly kind of her, and everything was perfectly fine when we got back. I
          also really wanted to swim across to another island nearby, but there were lifeguards
          everywhere making sure people stayed within the designated swimming area. I remember
          thinking they were unbelievably fast swimmers before eventually realizing they were
          wearing fins, which made a lot more sense.
      - photoIds:
          - p042
          - p043
          - p044
        prose: >-
          From the Blue Lagoon we headed over to Gozo, a smaller island north of Malta filled with
          historic buildings and beautiful old towns. After getting off the boat, Parth and I
          walked toward the main part of town and stumbled across a recreation of Bethlehem, which
          was something I had never seen before. It was a really cool depiction of what the town
          may have looked like historically, and a few cats had apparently decided to move in.
          Naturally we took a bunch of pictures and immediately sent them to Quinn. When we
          reached town we were surprised by how nice some of the public facilities were. They even
          had a bike pump track, which seemed completely random on this small island north of
          Malta, although apparently there is a decent biking culture there.
      - photoIds:
          - p045
          - p046
          - p047
        prose: >-
          We explored for a bit before stopping at one of the main restaurants for lunch. We
          ordered seafood risotto and pizza to share, and I got half a rabbit. It was a ridiculous
          amount of food. The seafood risotto was fantastic, and the rabbit was also really good,
          although surprisingly a little dry in places. Picture 47 was the large church we had
          been able to see from far away. We wanted to get a closer look, so we walked over,
          although we never actually went inside. Afterward we headed back down toward the water
          and waited for our boat to pick us up.
      - photoIds:
          - p048
          - p049
          - p050
        prose: >-
          Once we got back to the hotel we spent some time relaxing by the pool. While sitting
          there I started looking for something we could do that night and remembered seeing a
          poster for the Malta International Wine Festival on my way in from the airport.
      - photoIds:
          - p051
          - p052
          - p053
        prose: >-
          It turned out that night was the final night of the festival, so we decided to go, and
          it was a great decision. Admission even came with a wine glass, and the festival itself
          was much bigger and more fun than we expected, with tons of food options, live music,
          and different areas to explore.
      - photoIds:
          - p054
          - p055
          - p056
        prose: >-
          At one point we started talking with one of the owners or distributors behind one of the
          wine labels. He began walking us through different wines and letting us taste all kinds
          of varieties, and eventually he just started giving us bottles. By the end we somehow
          had the equivalent of almost four bottles of wine between all of the partially filled
          bottles he had handed us, including some pretty nice ones.
      - photoIds:
          - p057
          - p058
          - p059
        prose: >-
          Needless to say, we drank a lot of wine. We also made friends with a few girls sitting
          across from us who had watched this entire situation unfold and understandably thought
          it was hilarious that we kept getting free wine.
      - photoIds:
          - p060
          - p061
          - p062
          - p063
          - p064
        prose: >-
          For food we tried a truffle tortellini, paella, and a handful of other things. The live
          music was also unexpectedly hilarious because they were playing full on American rock
          and sing along songs, which was about the last thing I expected to hear at a Maltese
          wine festival. It ended up being one of the most unexpectedly fun nights of the trip.
  - id: day-five-valletta
    title: "Day Five: Valletta and Off to Bologna"
    photoIds:
      - p065
      - p066
      - p067
      - p068
      - p069
      - p070
      - p071
    prose: ''
    blocks:
      - photoIds:
          - p065
          - p066
          - p067
        prose: >-
          The next day we had a flight later in the afternoon, but we still had enough time to
          explore Valletta before leaving Malta. Valletta was gorgeous. The entire city felt like
          it had been built around a fortress, with beautiful old stone architecture, narrow
          streets, very little car traffic, and water surrounding everything. We did not have a
          ton of time, but we wandered through the city, explored the streets, and grabbed some
          gelato. The World Cup was still going on, and there was a giant inflatable soccer ball
          near the entrance to the city. It was pretty hot, but we walked all the way toward the
          end of Valletta before eventually turning around. On the way back we randomly discovered
          what looked like a secret underground entrance. It led through this really cool hallway
          toward some kind of underground theater experience. We did not have time to actually do
          it, but the entrance itself, shown in Picture 65, was worth checking out. Picture 66 was
          my gelato, which I initially thought was something special and local until Parth later
          informed me that it was actually from a chain you can find in Los Angeles. Picture 67
          was my attempt at a very mature photo where I stood behind part of a fountain and tried
          to make it look like I was peeing into it. The perspective did not really work, but the
          attempt was there.
      - photoIds:
          - p068
          - p069
          - p070
          - p071
        prose: >-
          Parth had a call later that day, and our flight to Bologna ended up getting delayed by a
          little more than six hours. We had originally planned to have about half a day in
          Bologna, but that obviously did not happen. The upside was that we got some extra time
          in Malta. I grabbed a Greek meal while we waited, and eventually we made our way to the
          airport and finally headed to Italy. By the time we got to Bologna it was pretty late.
          Pictures 70 and 71 were from when we finally checked into our Airbnb. The place was a
          little strange but also really cool. It felt like a combination of an art gallery and
          someone's local home, with tons of space and artwork everywhere. There was an older man
          who seemed to live in an adjoining part of the property, and there was literally a door
          from our place that led toward his room, although I think he had his own separate
          entrance. It was quirky but a really good deal. Parth let me take the bedroom while he
          took the pullout couch, and somehow the Airbnb also had a SpongeBob pillowcase, which I
          obviously had to point out to him.
