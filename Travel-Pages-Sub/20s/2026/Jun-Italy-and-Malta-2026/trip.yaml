introParagraph: >-
  Parth invited me to be his plus one to Freddie Bergman's wedding, which was the perfect
  excuse for a trip to Europe. I had never been to Italy or Malta before, so we turned the
  wedding into a much bigger adventure. We danced, ate lots of pasta, explored some
  incredible new places, and I even got to dive at one of the best wreck diving
  destinations in the world.
