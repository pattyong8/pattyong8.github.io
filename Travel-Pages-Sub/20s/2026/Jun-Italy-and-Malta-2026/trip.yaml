sections:
  - id: day-one-malta
    title: "Day One: Malta"
    photoIds:
      - p001
      - p002
      - p003
      - p004
      - p005
      - p006
      - p007
      - p008
    prose: ''
    blocks:
      - photoIds:
          - p001
          - p002
          - p003
        prose: >-
          Parth and I flew over separately because I wanted two extra days in Malta before he
          arrived. Leaving on Wednesday felt manageable with work, while Parth preferred to leave
          on Friday. I also found a great deal using the new Chase Sapphire Reserve benefits and
          got basically $500 off a two night stay at an IHG property right by the water, with
          great amenities, wonderful service, and around $100 in dining credits that we made sure
          to use. After arriving I walked around the area and stopped by the scuba shop where I
          would be diving the next morning, mostly just to check in, say hi, and make sure
          everything was ready.
      - photoIds:
          - p004
          - p005
          - p006
          - p007
          - p008
        prose: >-
          The rest of the day was exactly what I wanted from arriving early. I spent time around
          the hotel, relaxed by the pool, read some books on my phone, and enjoyed being in Malta
          by myself. I honestly could not remember the last time I had traveled to a new country
          alone and stayed somewhere really nice with almost nothing I needed to do.

          That evening I had dinner on the rooftop of the hotel, ordered sushi, and watched the
          sun go down over the water. Pictures 4 through 8 really capture how peaceful that first
          evening was. Between all of the traveling, diving, and activities that would come later,
          it was really nice to have some time completely to myself and just enjoy being somewhere
          new.
  - id: day-two-diving
    title: "Day Two: Diving and Malta Nightlife"
    photoIds:
      - p009
      - p010
      - p011
      - p012
      - p013
      - p014
      - p015
    prose: ''
    blocks:
      - photoIds:
          - p009
          - p010
          - p011
        prose: >-
          The next morning was the beginning of my scuba diving. I was working toward my advanced
          scuba certification, which required five different dives over the next couple of days.
          Picture 9 overlooks the area where many of the boats were parked near the scuba center,
          around the Hilton and Marriott hotels. My first dives were more focused on learning than
          sightseeing. We stayed around the nearby reef and worked on things like buoyancy and
          underwater navigation, nothing too crazy, but important skills to practice before some
          of the more exciting dives later in the trip.
      - photoIds:
          - p012
          - p013
          - p014
          - p015
        prose: >-
          After diving I went to a nearby Maltese restaurant for lunch and had one of my favorite
          meals of the trip. I learned that rabbit is a traditional food in Malta, with a history
          tied to the island and periods when people relied heavily on locally available animals
          for food. There is also a lot of Italian influence in Maltese cuisine, so there were
          plenty of rich stews, tomatoes, and familiar Mediterranean flavors. The rabbit was
          spectacular, genuinely one of the best rabbit dishes I have ever had. The guy working
          there noticed that I was taking a bunch of photos and notes about the food, so he
          started explaining the dishes, ingredients, and how everything was prepared, and even
          brought me a small sample of a pork stew they had, which had a similar base to the
          rabbit and was also delicious. Picture 13 was the dessert that came at the end of the
          meal and gave me another chance to try something local. The entire lunch ended up being
          such a great introduction to Maltese food, and I felt incredibly well taken care of.

          That night I ended up meeting a guy from a dating app who had grown up in Malta, and he
          offered to show me around some of the nightlife. We bounced around a few clubs and bars
          in the area. I cannot exactly say I was immersing myself in authentic Maltese culture
          because we were mostly surrounded by European tourists, especially Parisians. Apparently
          Malta is a major party destination for them. The drinking age was also 16, and you could
          definitely tell that the crowd skewed young. I felt a little out of place, but it was
          still really fun to experience, and I immediately decided that I needed to bring Parth
          back once he arrived.
  - id: day-three-parth
    title: "Day Three: Parth Arrives"
    photoIds:
      - p016
      - p017
      - p018
      - p019
      - p020
      - p021
      - p022
      - p023
      - p024
      - p025
      - p026
      - p027
      - p028
      - p029
    prose: ''
    blocks:
      - photoIds:
          - p016
          - p017
          - p018
        prose: >-
          Parth arrived pretty early the next morning, around 8 a.m., and basically went straight
          to bed. While he slept I headed back up to the rooftop restaurant for lunch and had
          another fish dish with mushrooms and fries. Nothing too crazy, but it was nice to grab
          some food before spending most of the afternoon by the pool. The weather in Malta was
          perfect, and I was very happy doing basically nothing for a few hours. At one point
          there was a guy in the pool playing by himself with a miniature soccer ball. I was
          getting a little bored, so I asked if he wanted to toss it back and forth. He was
          totally down, and we ended up talking for a while about where he was traveling from, who
          he was traveling with, and even American football. Just a random interaction, but one of
          those small travel memories that I really enjoyed.
      - photoIds:
          - p019
          - p020
          - p021
        prose: >-
          Eventually I headed back to the room, where Parth was still sleeping. He finally got up,
          and we decided it was time to actually explore together. We started with dinner back on
          the rooftop, sharing some sushi before ordering our own mains. I got the salmon, and
          then we headed out to walk around Malta for the night.
      - photoIds:
          - p022
          - p023
          - p024
        prose: >-
          I showed Parth the crazy nightlife area I had explored the night before. There were
          plenty of supercars driving around, which Parth obviously enjoyed, and the World Cup was
          happening, so seemingly everywhere we walked had the game playing. We kept walking
          toward the first bar I had visited the previous night, although we never quite made it
          all the way there. Instead we stopped at an Irish pub nearby, grabbed a beer, and spent
          some time catching up.
      - photoIds:
          - p025
          - p026
          - p027
          - p028
          - p029
        prose: >-
          Eventually we made our way back toward the main clubbing area. Pictures 24 through 28
          capture us bouncing around a few of the bars. Most of them were free to enter, so we
          just wandered around, listened to music, people watched, and enjoyed the chaos.

          Naturally we ended the night with pizza. Picture 29 was from a place literally called
          Famous Pizza, which we thought was hilarious and felt like the appropriate way to finish
          our first real night together in Malta.
  - id: day-four-blue-lagoon
    title: "Day Four: Blue Lagoon, Gozo, and the Wine Festival"
    photoIds:
      - p030
      - p031
      - p032
      - p033
