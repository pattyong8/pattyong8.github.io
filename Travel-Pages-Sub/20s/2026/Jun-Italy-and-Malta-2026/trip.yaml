    blocks:
      - photoIds:
          - p122
          - p123
          - p124
        prose: >-
          The next morning we headed to the train station to make our way from Bologna to
          Florence. The train itself was incredibly easy, although we quickly learned that Italian
          trains were not exactly the most punctual, and we ended up waiting around the station
          for a while before ours finally arrived. Eventually we got on, and the actual ride to
          Florence was pretty quick, only around an hour or two. When we arrived we had another
          logistical problem to figure out. Our Airbnb was not actually in Florence because we had
          chosen somewhere closer to Freddie's wedding venue, and we obviously did not want to
          carry our luggage around the city all day. Around Picture 123 we found this random self
          service luggage storage place where we could lock everything up and leave it for the
          day.
      - photoIds:
          - p125
          - p126
          - p127
        prose: >-
          With that taken care of, the first thing I did in Florence was, very thematically for
          this trip, get gelato. It turned out to be one of the highest rated gelato shops in
          Florence, which was exactly why I had taken a picture of it in the first place, and it
          lived up to the ratings. We spent the next couple of hours wandering around Florence
          before deciding we needed lunch.
      - photoIds:
          - p128
          - p129
          - p130
        prose: >-
          Liam is obsessed with All'Antico Vinaio, so obviously I had to try the original while we
          were actually in Florence, and Parth was very interested too. The location we found was
          so popular that it basically had three separate entrances to handle all of the people.
          The sandwiches were just as good as they are in the United States, if not better.
      - photoIds:
          - p131
          - p132
          - p133
        prose: >-
          One of my favorite little memories from lunch was trading sandwiches back and forth so
          we could try both. At one point he asked which one I liked better. I told him I did not
          have a preference.
      - photoIds:
          - p134
          - p135
          - p136
        prose: >-
          He gave me the one I liked better anyway, which is Picture 135. Apparently he could read
          my mind. That's how you know you've been friends for a while.

          After lunch we walked past the Duomo, and Parth needed to take an investor call that was
          going to last an hour or two. I left him at a Starbucks with free WiFi and decided to
          wander around Florence by myself. Earlier that day we had noticed that one of the main
          squares was completely blocked off with bleachers on every side, and we assumed there
          might be a play or some kind of performance happening later.
      - photoIds:
          - p137
          - p138
          - p139
        prose: >-
          As I walked around, though, I started noticing people everywhere dressed in blue, green,
          and red. It turned out we had randomly arrived in Florence during a centuries old local
          tradition called Calcio Storico. It was basically this insane combination of medieval
          football, rugby, and MMA, and that day was the final.
      - photoIds:
          - p140
          - p141
          - p142
        prose: >-
          I immediately became obsessed with figuring out how to get inside.

          The event was completely sold out, and tickets were going for more than 100 euros. I
          started asking people around the entrances if anyone would sell me theirs, and
          unsurprisingly nobody wanted to give up their ticket. So I tried one last strategy. I
          found a random piece of paper that looked vaguely like a ticket, shoved myself into the
          middle of a crowd entering the stadium, and walked in with everyone as they filed
          through the entrance. Somehow nobody checked my ticket, and suddenly I was inside. It
          ended up being one of the coolest travel experiences I have ever randomly stumbled into.
      - photoIds:
          - p143
          - p144
          - p145
        prose: >-
          I was surrounded by local Italians and people from all over Europe who were completely
          invested in the match. Everyone had chants. People were waving flags and setting off
          flares. I happened to be sitting with supporters of the blue team, who were apparently
          the favorites. Picture 144 shows the blue flares going off around the stands, and
          Picture 145 shows this enormous banner that stretched across basically the entire
          bleacher section. Before the match even started there was an opening ceremony that
          lasted at least half an hour.
      - photoIds:
          - p146
          - p147
          - p148
        prose: >-
          Everyone came out wearing traditional clothing that looked straight out of medieval
          Florence, with drums, processions, costumes, and all kinds of ceremony surrounding the
          game. Then they started playing, and it was chaos. I had almost no idea what the rules
          were and did not bother asking anyone, but that did not really matter. I stayed for what
          I think was roughly the first half just taking everything in.

          Eventually Parth finished his investor call, so I left and met him in another square
          nearby. Apparently, while walking over, he had passed restaurants showing the match and
          was wondering what the heck everyone was watching, while I had somehow snuck into the
          actual game. When I found him, Parth was already halfway through an Aperol Spritz and
          had discovered a bar selling them for four euros, so we took full advantage.
      - photoIds:
          - p149
          - p150
          - p151
        prose: >-
          I had several Aperol Spritzes while we hung around the square and Parth finished up some
          work. By Picture 149 we had moved over to a nearby park where we sat around with our
          drinks, snacked on a few things, and figured out what we wanted to do for dinner.

          Eventually we started walking back toward the main part of Florence. Along the way we
          stumbled onto a bridge where seemingly everyone had gathered for sunset. It was
          beautiful.
      - photoIds:
          - p152
          - p153
          - p154
        prose: >-
          The sky had turned pink over the city, with the water below us and Florence stretching
          out in every direction. It was one of those moments where there was not really anything
          to do other than stand there and enjoy where we were.

          For dinner we ended up choosing a fairly random restaurant because we wanted to find
          somewhere with good cacio e pepe, and it turned out to be an incredible choice. Pictures
          154 through 156 were our meal. The mushroom risotto was to die for, the burrata was
          incredible, and the cacio e pepe was great. Another fantastic meal in a trip that was
          becoming mostly pasta, gelato, and Aperol Spritzes. By the time we finished it was late
          and we still needed to get all the way out to our Airbnb near the wedding venue. We
          grabbed our luggage and headed toward the train station because there were basically no
          Ubers and that was where we could find taxis.
      - photoIds:
          - p155
          - p156
          - p157
          - p158
        prose: >-
          Unfortunately about 30 other people had the exact same idea. It was already past
          midnight, the taxi line was enormous, and maybe one car was showing up every five
          minutes. We waited for almost an hour. There technically was an Uber option, but it was
          something ridiculous like 200 euros. When we finally got into a taxi, I do not think
          either of us had ever been happier to see one. The drive was long enough that walking
          was never going to be an option, and eventually we finally made it out to where we were
          staying.
  - id: freddies-wedding
    title: "Day Eight: Freddie's Wedding"
    photoIds:
      - p159
      - p160
      - p161
      - p162
      - p163
      - p164
      - p165
      - p166
      - p167
      - p168
