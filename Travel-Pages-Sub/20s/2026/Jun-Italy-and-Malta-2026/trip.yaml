    blocks:
      - photoIds:
          - p072
          - p073
          - p074
        prose: >-
          The next morning we started with pastries to fuel up for what was basically Parth's
          pilgrimage through the Italian car world. We grabbed a mushroom focaccia toast and a
          croissant filled with cream in Picture 74.
      - photoIds:
          - p075
          - p076
          - p077
        prose: >-
          Picture 75 was a fruit tart, and then we headed to pick up our rental car and made one
          slight mistake. Apparently you need your passport to rent a car in Italy, and neither of
          us had brought ours, so we had to bike all the way back to the Airbnb, grab them, and
          then bike back to the rental agency. It only set us back about an hour, but it was a
          pretty silly way to start the day. Ironically we did not even need the international
          driver's license we had prepared. Parth was obviously the driver. This was his car
          mecca, so it only felt appropriate. As we drove through this part of Italy we kept
          joking that it basically looked like Napa, with open green fields, vineyards or at least
          fields that looked like vineyards, and beautiful countryside everywhere.
      - photoIds:
          - p078
          - p079
          - p080
        prose: >-
          Our first major stop was Lamborghini. I was nowhere near as knowledgeable about the cars
          as Parth, but it was honestly just as fun watching him get excited about everything. He
          seemed to know every car we saw, including the model, the details, and sometimes even
          exactly how many existed.
      - photoIds:
          - p081
          - p082
          - p083
        prose: >-
          Some were incredibly rare, including cars where only one had ever been made. I happily
          walked around looking at everything with basically the same amount of wonder, even if I
          had no idea what I was actually looking at half the time.
      - photoIds:
          - p084
          - p085
          - p086
        prose: >-
          Picture 85 was after we left the factory. There were a few Lamborghinis parked outside a
          nearby cafe that seemed to belong to regular visitors, which was fun because we could
          get right up next to cars that were actually being driven around.

          Next was Pagani. The museum was much smaller, and I had not realized how few Pagani
          models there actually were.
      - photoIds:
          - p087
          - p088
          - p089
        prose: >-
          Some of the cars were absolutely wild, including one with doors that opened upward
          instead of outward. While Parth continued looking at the cars, I found a drawing table
          where you could try sketching some of the Pagani designs.
      - photoIds:
          - p090
          - p091
          - p092
        prose: >-
          I thought I might make something cool enough to take home as a souvenir, but my drawing
          was pretty terrible, so it stayed there. On our way out there was a visitor book where
          people could leave messages, and we signed ours Sweet Peats, the name Quinn had coined
          for us earlier that year.

          Ferrari was the main event, and this was truly Parth's mecca. We got incredibly lucky
          almost immediately. As we arrived we saw an F80 pull into the Ferrari factory after
          apparently being out for a test drive.
      - photoIds:
          - p093
          - p094
          - p095
        prose: >-
          I had absolutely no idea what I was looking at. Parth very much did. Seeing an F80
          actually driving back into the Ferrari factory was apparently a pretty incredible sight,
          and even without understanding how special it was, I knew from Parth's reaction that we
          had gotten lucky.

          We eventually made our way into the museum, which was probably five or even ten times
          larger than the other museums we had visited that day. For obvious reasons, Ferrari is
          Ferrari.
      - photoIds:
          - p096
          - p097
          - p098
        prose: >-
          We walked through room after room of cars.

          On our way out we found a couple of interactive experiences. One was a photo opportunity
          inside a Ferrari, and the other was a full F1 racing simulator.
      - photoIds:
          - p099
          - p100
          - p101
        prose: >-
          There was absolutely no way Parth was leaving Ferrari without doing the simulator. The
          entire seat and car body moved as he turned, and he had a full F1 steering wheel covered
          in buttons and controls.
      - photoIds:
          - p102
          - p103
          - p104
        prose: >-
          At first it looked incredibly difficult to control, but Parth slowly figured it out, and
          by the end, according to him at least, he was taking the turns like a pro. I took plenty
          of pictures.
      - photoIds:
          - p105
          - p106
          - p107
        prose: >-
          Before driving back to Bologna we stopped in Modena for dinner and explored the city for
          a bit. We randomly found an anime store filled with manga and all kinds of other
          superhero and Harry Potter stuff, which naturally meant taking pictures and sending them
          to Quinn. Then we sat down at a local restaurant and ordered a bunch of pasta. I tried
          the tortellini in broth that Modena is known for, and it was okay.
      - photoIds:
          - p108
          - p109
          - p110
        prose: >-
          The Bolognese, however, was fantastic, and Parth ordered a white sauce mushroom pasta
          that was also incredible. Overall it was a really good meal and a very appropriate way
          to end our car tour through this part of Italy. And because I apparently could not go
          more than a few hours anywhere in Europe without getting ice cream, I obviously got some
          on the way back.

          Once we got back to Bologna, Parth needed to work for a while. Since I knew we would
          barely have any time to see the city the next day, I decided to head out by myself and
          explore.
      - photoIds:
          - p111
          - p112
          - p113
        prose: >-
          I did not even realize Bologna had canals until I started walking around. Pictures 110
          through 115 were from me wandering through the city and discovering them.
      - photoIds:
          - p114
          - p115
          - p116
        prose: >-
          There is even a famous little window, shown in Picture 113, where you can look out over
          one of the canals.

          Eventually I stumbled into Bologna's main square, and this ended up being one of my
          favorite random memories from the trip. The city was running a summer movie series and
          had basically converted the entire square into an enormous outdoor movie theater. There
          must have been more than 500 people sitting there watching an old black and white
          American movie. I had absolutely no idea this was happening. I had just walked into it.
          The movie had only recently started, so I decided to sit down and watch.
      - photoIds:
          - p117
          - p118
          - p119
          - p120
          - p121
        prose: >-
          I ended up staying for most of it, and it was actually pretty good. More than anything,
          it was just incredibly cool to randomly find myself sitting in the middle of Bologna
          with hundreds of people watching an old American movie projected onto a giant screen in
          the middle of this beautiful historic square. It was exactly the kind of spontaneous
          travel experience that you could never really plan. Eventually I headed back to the
          Airbnb, where I found Parth hanging out on the bed waiting for me. Picture 121 was the
          end of a very long but very fun day.
