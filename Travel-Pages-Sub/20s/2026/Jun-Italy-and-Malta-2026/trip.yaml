      - p172
      - p173
      - p174
      - p175
      - p176
      - p177
      - p178
      - p179
    prose: ''
    blocks:
      - photoIds:
          - p159
          - p160
          - p161
        prose: >-
          The next morning was wedding day. I started with the complimentary breakfast overlooking
          the countryside around Florence, and it was gorgeous. I also realized that we were
          basically in the middle of Tuscany, which somehow I had not really processed when
          planning the trip. In retrospect I wish I had planned some kind of wine tasting or food
          experience out in the countryside that morning, but no worries. Just another reason to
          come back. After breakfast I went back to see Parth, who had some work to finish, so I
          headed down to the pool instead. I was literally the only person there. I grabbed a
          lounger in the shade, swam around, and spent the morning relaxing. That actually became
          a recurring theme of the trip. Between Malta and Tuscany, there was a lot of time spent
          around pools and in the ocean, which I am always happy about.
      - photoIds:
          - p162
          - p163
          - p164
        prose: >-
          Eventually it was time to get ready. Parth and I put on our tuxes and called a cab to
          the wedding venue, which was essentially a castle tucked into the hills. Neither of us
          really knew how large Freddie's wedding was going to be, and when we arrived we realized
          it was incredibly intimate, probably fewer than 30 people. We said hi to Goose and
          Augustina, met more of the family and friends, and settled in for the ceremony. The
          ceremony itself was simple and beautiful. Their vows were wonderful, and it was really
          special getting to be there for Freddie's big day.
      - photoIds:
          - p165
          - p166
          - p167
        prose: >-
          Also, what an honor to somehow be the plus one at a wedding with fewer than 30 people.
          After the ceremony the drinks started flowing, and one of the options was, naturally, an
          Aperol Spritz. Given that an Aperol Spritz is basically my favorite drink, I had quite a
          few. Pictures 163 through 165 were basically an entire photoshoot of me holding one,
          which was obviously necessary. If I was going to be at a wedding in Tuscany drinking
          Aperol Spritzes, I needed photographic evidence.
      - photoIds:
          - p168
          - p169
          - p170
        prose: >-
          Eventually we made our way up to dinner. The table was set at the very top of the castle
          overlooking the Tuscan countryside, and Picture 168 really captured the view. The meal
          itself was fantastic, and because a few people had canceled, there were plenty of extra
          servings to go around. The first course was duck breast, which was great. Picture 170
          was the cacio e pepe, perfectly al dente and incredibly creamy. Then came the steak in
          Picture 171, which was probably my favorite, with a great sauce, spinach, and plenty of
          extra pieces of steak by the end.
      - photoIds:
          - p171
          - p172
          - p173
        prose: >-
          One funny part of dinner was the seating arrangement. Freddie and the Bergmans were all
          on one side of the table, while Freddie's wife and her family were on the other, and
          somehow Parth and I ended up all the way at the far end on her family's side. It
          actually worked out perfectly because I sat near the father of the bride and learned
          that he worked in construction and real estate. We really hit it off and ended up
          talking about getting together again in New York. I even told him that the next time I
          had tickets to a game, I would invite him.
      - photoIds:
          - p174
          - p175
          - p176
        prose: >-
          After dinner the party started. It may have been an intimate wedding, but there was
          still a dance floor, plenty of music, and obviously plenty more drinks. At one point I
          asked the bartender to make me his favorite cocktail that he had invented himself
          because he told me how much he loved making drinks. He made this Aperol and mezcal
          cocktail that was fantastic, and I proceeded to order many more. Picture 174 was us
          recreating an old childhood photo of Parth, Gustav, and Freddie, which was such a fun
          little moment. Later in the night Parth and I started roaming around the castle to see
          what else was there.
      - photoIds:
          - p177
          - p178
          - p179
        prose: >-
          Pictures 176 through 178 were from us exploring. The property was enormous and such a
          ridiculous place to have a wedding. We did learn that there was no air conditioning and
          plenty of mosquitoes, so staying in an actual castle apparently had its tradeoffs. By
          Picture 179 the night was winding down. Gustav and Augustino were kind enough to drive
          us back, and we all headed home together after such a fun wedding night.
  - id: day-nine-florence
    title: "Day Nine: Back to Florence"
    photoIds:
      - p180
      - p181
      - p182
      - p183
      - p184
      - p185
      - p186
      - p187
      - p188
      - p189
      - p190
    prose: ''
    blocks:
      - photoIds:
          - p180
          - p181
          - p182
        prose: >-
          The next morning we met up with Goose and Augustino and headed back to the castle to say
          goodbye to everyone. The group was planning to spend the day hanging around the pool,
          but Parth and I wanted one more real day in Florence. Before leaving we played some
          cards, ate some ice cream, and spent a little more time with the bride, groom, and
          everyone else from the wedding. Eventually we said our goodbyes and caught a ride with
          Gustav and Augustino, who needed to head to the airport anyway.
      - photoIds:
          - p183
          - p184
          - p185
        prose: >-
          From the airport we were able to take the train into Florence and check into our
          accommodation for the night, and wow, it was one of the coolest rooms we had stayed in.
          It was not actually an Airbnb, just some random hotel style booking we had found online,
          but the bedroom was spacious and modern, and the bathroom had a full two person
          whirlpool and its own sauna. Somehow it was also one of the cheapest accommodations we
          found in Florence. We dropped off our stuff and relaxed for a while, and we even went
          back and got All'Antico Vinaio again because the sandwiches had been so good the first
          time.
      - photoIds:
          - p186
          - p187
          - p188
          - p189
          - p190
        prose: >-
          Parth eventually needed to work, which gave me the perfect excuse to fully take
          advantage of the room. I used the sauna and whirlpool and basically turned the bathroom
          into a steam room. At one point Parth needed to use the bathroom, walked in, immediately
          walked back out, and told me he literally could not use it because I had made the room
          so hot. Worth it. Since it was our final night in Italy, we eventually headed back out.
          Parth remembered a few places he had visited in Florence with Jeremy and Elliot,
          including a hilltop viewpoint overlooking the city. We took electric bikes most of the
          way there and then walked up the final little hill.

          The view was incredible. You could see practically all of Florence stretched out below
          us as the sun went down. We were not really in the mood to drink after the wedding, so
          we grabbed a couple of nonalcoholic drinks and just sat there enjoying the sunset. It
          was such a simple way to spend our last evening in Italy, but one of the prettiest. For
          dinner Parth remembered a restaurant he had loved on his previous trip, tucked down a
          small side street and much more local than many of the restaurants we had passed in the
          busier parts of Florence. Almost everything was fantastic. The large tortellini and
          ravioli were to die for. The one miss was the gnocchi. We had not realized it came in a
          beetroot sauce, and the beet flavor was just way too strong for me. It was not creamy or
          acidic enough to balance it out. It just tasted very, very beet. Still, two incredible
          pastas out of three was a pretty good way to end our time in Italy.
  - id: day-ten-paris
    title: "Day Ten: One More Day in Paris"
    photoIds:
      - p191
      - p192
      - p193
      - p194
      - p195
      - p196
    prose: ''
    blocks:
      - photoIds:
          - p191
          - p192
          - p193
        prose: >-
          On our way home, Parth and I had the option of taking a long layover in Paris, somewhere
          around 12 to 18 hours, so obviously we took it. We had both been to Paris before, so
          there was no pressure to run around checking off tourist attractions. We could just
          spend the day eating, walking around, and revisiting a city we already knew. We started
          with brunch in one of the LGBTQ neighborhoods at a restaurant covered in umbrellas. I
          ordered avocado toast with salmon, which sounded great but ended up being surprisingly
          disappointing. The salmon tasted way too fishy, so I ate about half and gave up.
      - photoIds:
          - p194
          - p195
          - p196
        prose: >-
          My mom and Doug had also been in Paris not long before us and had told me about a bakery
          they loved that had a Taiwanese owner. Pictures 194 and 195 were from our visit there.
          Parth was nice enough to trek across the city with me to check it out, and it was
          definitely worth the stop. Paris was also brutally hot that day, and we spent a good
          portion of our walking route ducking into random stores just for air conditioning. Not
          every place had it, because Paris, but thankfully enough of the retail stores did. Then
          came easily my most important stop of the day, Chez Janou. I had gone there during our
          2024 Olympics trip and still remembered the duck breast as one of my favorite dishes of
          all time, and there was no way I was going to have a long layover in Paris and not go
          back. It was every bit as good as I remembered. The duck breast was massive and
          perfectly cooked, with incredibly crispy skin. The potatoes were unbelievable, and the
          red wine sauce was so good that the entire dish still ranks as one of my favorites
          anywhere. Parth did not even really need to eat, but he was willing to come all the way
          over with me and hang out while I sat at the bar basically just to eat this one specific
          duck dish. It sounds like a small thing, but it was genuinely one of those moments that
          reminded me how caring our friendship is. And that was the end of the trip. What started
          as Parth inviting me to be his plus one to Freddie's wedding somehow turned into Malta,
          scuba diving, the Blue Lagoon, Gozo, a wine festival, Bologna, Lamborghini, Pagani,
          Ferrari, Modena, Calcio Storico, Tuscany, a castle wedding, and one final day eating our
          way through Paris. Always love going to Europe, and I am very glad we managed to turn an
          Italy trip for Freddie's wedding into a Malta and Paris trip too.
