introParagraph: >-
  Game two out of three for my 2026 Knicks season. I randomly got a last second ticket after someone
  couldn't make the Knicks versus Pacers game, so I brought Elijah, one of my good real estate
  friends who I've gotten to know and hang out with a lot in New York.


  This ended up being an incredible game to attend. It was extremely close and went all the way to
  double overtime, with Elijah and me going off the entire time. Sadly, the Knicks didn't pull out
  the win, but the energy at Madison Square Garden was electric. Certainly not game four of the NBA
  Finals, but still one of the most exciting basketball games I've gotten to see in person.
