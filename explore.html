	<title>Map · ONGtheroad</title>

	<link rel="stylesheet" href="assets/css/vendor.css">
	<link rel="stylesheet" href="assets/css/main.css">
	<script src="assets/js/modernizr.js"></script>

	<link rel="shortcut icon" type="image/icon" href="assets/logo/favicon.png"/>
	<link href="https://fonts.googleapis.com/css?family=Rufina:400,700" rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet" />
	<link rel="stylesheet" href="assets/css/font-awesome.min.css" />

	<link rel="stylesheet" href="assets/css/bootsnav.css"/>

	<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>

	$(function(){
	  $("#header").load("header-E.html?v=17");
	});

<body class="explore-body">
	<div id="header"></div>

	<main class="explore-shell">
		<div id="explore-map" aria-label="Interactive map of places visited"></div>

		<aside class="explore-panel" id="explore-panel">
			<button class="explore-panel-toggle" id="explore-panel-toggle" type="button" aria-label="Toggle destination list">
				<span></span>
			</button>

			<div class="explore-panel-inner">
				<div class="explore-preview" id="explore-preview"></div>
				<div class="explore-kicker">By place</div>
				<h1>Where I've been</h1>
				<p class="explore-lede">Shaded states, provinces, and countries are places I have been. Each marker shows who I mostly went with: family, friends, work, or solo. Choose one to open its memories.</p>
				<p class="explore-caption" id="explore-stats"></p>

				<label class="explore-select">
					<span class="sr-only">Choose a destination</span>
					<select id="explore-destination"></select>
				</label>

				<div class="explore-type-row" role="group" aria-label="Who I went with">
					<button type="button" class="is-active" data-type="" aria-pressed="true">All</button>
					<button type="button" data-type="family" aria-pressed="false">
						<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 2.1 1.8 7.2V14h4.4V9.4h3.6V14h4.4V7.2L8 2.1z"/></svg>
						Family
					</button>
					<button type="button" data-type="friends" aria-pressed="false">
						<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6 7.1a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zm5.3.5a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8zM2.1 13.6c.3-2.2 2-3.5 3.9-3.5s3.6 1.3 3.9 3.5H2.1zm7.5 0c.2-1.3.7-2.3 1.5-2.9.8.3 1.6.5 2.5.5 1.3 0 2.3-.5 2.5 1.6v.8H9.6z"/></svg>
						Friends
					</button>
					<button type="button" data-type="work" aria-pressed="false">
						<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6 3.2h4V5h3.1c1 0 1.8.8 1.8 1.8v6.1c0 1-.8 1.8-1.8 1.8H3.1c-1 0-1.8-.8-1.8-1.8V6.8C1.3 5.8 2.1 5 3.1 5H6V3.2C6 2.5 6.5 2 7.2 2h1.6C9.5 2 10 2.5 10 3.2V5H6V3.2z"/></svg>
						Work
					</button>
					<button type="button" data-type="solo" aria-pressed="false">
						<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="5" r="2.8" fill="currentColor"/><path fill="currentColor" d="M2.6 14c0-3 2.4-4.8 5.4-4.8s5.4 1.8 5.4 4.8z"/></svg>
						Solo
					</button>
				</div>

				<div id="explore-list-view">
					<div class="explore-list-label" id="explore-list-label">Destinations</div>
					<div id="explore-place-list"></div>
				</div>

				<div id="explore-detail-view" hidden></div>
			</div>
		</aside>
	</main>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
	<script src="assets/js/bootstrap.min.js"></script>
	<script src="assets/js/explore-map.js?v=53"></script>
</body>
</html>
